[project]
name = "baby-tracker"
version = "1.1.0"
description = "Home Assistant custom integration for tracking diapers, feedings and sleep."
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["custom_components.baby_logger"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "PL", "ASYNC", "PT", "C4"]
ignore = ["D203", "D213", "PLR0913", "PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR0915"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
combine-as-imports = true
