log_diaper:
  fields:
    config_entry_id: &entry
      required: true
      selector:
        config_entry:
          integration: baby_logger
    type:
      required: true
      default: wet
      selector:
        select:
          translation_key: diaper_type
          options:
            - wet
            - dirty
            - both
    time: &time
      selector:
        datetime:

log_feeding:
  fields:
    config_entry_id: *entry
    side:
      required: true
      default: left
      selector:
        select:
          translation_key: feeding_side
          options:
            - left
            - right
            - bottle
    amount_ml:
      selector:
        number:
          min: 0
          max: 2000
          step: 5
          unit_of_measurement: ml
          mode: box
    time: *time

start_sleep:
  fields:
    config_entry_id: *entry
    time: *time

end_sleep:
  fields:
    config_entry_id: *entry
    time: *time

add_sleep:
  fields:
    config_entry_id: *entry
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:

undo:
  fields:
    config_entry_id: *entry

delete_event:
  fields:
    config_entry_id: *entry
    event_id:
      required: true
      selector:
        text:

log_growth:
  fields:
    config_entry_id: *entry
    weight:
      selector:
        number:
          min: 0
          max: 330
          step: 0.01
          mode: box
    length:
      selector:
        number:
          min: 0
          max: 220
          step: 0.1
          mode: box
    units:
      default: metric
      selector:
        select:
          translation_key: units
          options:
            - metric
            - imperial
    date: &date
      selector:
        date:
    note: &note
      selector:
        text:

delete_growth:
  fields:
    config_entry_id: *entry
    event_id:
      required: true
      selector:
        text:

set_milestone:
  fields:
    config_entry_id: *entry
    milestone: &milestone
      required: true
      selector:
        text:
    date: *date
    note: *note

clear_milestone:
  fields:
    config_entry_id: *entry
    milestone: *milestone

add_milestone:
  fields:
    config_entry_id: *entry
    name:
      required: true
      selector:
        text:
    date: *date
    note: *note

delete_milestone:
  fields:
    config_entry_id: *entry
    milestone: *milestone

log_entry:
  fields:
    config_entry_id: *entry
    type:
      required: true
      default: medicine
      selector:
        select:
          translation_key: care_type
          custom_value: true
          options:
            - medicine
            - temperature
            - note
    text:
      selector:
        text:
    value:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box
    units:
      default: metric
      selector:
        select:
          translation_key: temperature_units
          options:
            - metric
            - imperial
    time: *time

add_care_type:
  fields:
    config_entry_id: *entry
    name:
      required: true
      selector:
        text:
    emoji:
      selector:
        text:
    unit:
      selector:
        text:

delete_care_type:
  fields:
    config_entry_id: *entry
    care_type:
      required: true
      selector:
        text:

add_treatment:
  fields:
    config_entry_id: *entry
    name:
      required: true
      selector:
        text:
    dose:
      selector:
        text:
    every_hours:
      selector:
        number:
          min: 0.5
          max: 168
          step: 0.5
          unit_of_measurement: h
          mode: box
    days:
      selector:
        number:
          min: 1
          max: 366
          mode: box
    start:
      selector:
        datetime:

give_dose:
  fields:
    config_entry_id: *entry
    treatment_id: &treatment
      required: true
      selector:
        text:
    time: *time

stop_treatment:
  fields:
    config_entry_id: *entry
    treatment_id: *treatment
