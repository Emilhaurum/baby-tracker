name: Validate

# Runs on pull requests, weekly (to catch new Home Assistant releases breaking
# the integration) and as part of the release workflow. Before pushing, run the
# same checks locally with scripts/validate.sh.
on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the card's JavaScript
        run: |
          node --check custom_components/baby_logger/frontend/baby-logger-card.js
          TZ=Europe/Copenhagen node --test tests/js/*.test.mjs
      - name: Versions match
        run: python scripts/set_version.py --check "$(jq -r .version custom_components/baby_logger/manifest.json)"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          pip install -r requirements_test.txt
          # The integration depends on the frontend; install the version Home Assistant pins.
          pip install "$(python -c "import json, pathlib, homeassistant; print(json.loads((pathlib.Path(homeassistant.__file__).parent / 'components/frontend/manifest.json').read_text())['requirements'][0])")"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  e2e:
    name: End-to-end (HA ${{ matrix.ha || 'latest' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version from hacs.json and the latest release. Older releases
        # often fail to show the card ("Custom element doesn't exist"), see #20.
        ha: ["2026.11.0", ""]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the matrix uses the minimum from hacs.json
        if: matrix.ha != ''
        run: |
          minimum="$(python -c "import json; print(json.load(open('hacs.json'))['homeassistant'])")"
          if [ "$minimum" != "${{ matrix.ha }}" ]; then
            echo "hacs.json requires $minimum but the e2e matrix tests ${{ matrix.ha }}" >&2
            exit 1
          fi
      - name: Install Home Assistant
        run: |
          # Home Assistant refuses to start outside a virtual environment.
          python -m venv venv
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
          venv/bin/pip install "homeassistant${{ matrix.ha && format('=={0}', matrix.ha) || '' }}"
          # Pre-install the frontend so the first start doesn't have to.
          venv/bin/pip install "$(venv/bin/python -c "import json, pathlib, homeassistant; print(json.loads((pathlib.Path(homeassistant.__file__).parent / 'components/frontend/manifest.json').read_text())['requirements'][0])")"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Test the card with a mocked hass
        if: matrix.ha == ''
        run: node --test tests/card/*.test.mjs
      - name: Start Home Assistant
        run: |
          mkdir -p ha-config/custom_components
          cp -r custom_components/baby_logger ha-config/custom_components/
          printf 'default_config:\nlogger:\n  default: warning\n' > ha-config/configuration.yaml
          nohup hass -c ha-config > hass.log 2>&1 &
      - name: Set up the integration and dashboard
        timeout-minutes: 15
        run: python tests/e2e/setup_instance.py http://localhost:8123 > tokens.json
      - name: Test the card in a browser
        run: node tests/e2e/card.mjs http://localhost:8123 tokens.json e2e-output
      - name: Check the log for errors from the integration
        run: |
          if grep -E "ERROR.*baby_logger|Traceback.*baby_logger" hass.log; then exit 1; fi
      - name: Show the Home Assistant log
        if: failure()
        run: tail -n 300 hass.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.ha || 'latest' }}
          path: |
            e2e-output
            hass.log
