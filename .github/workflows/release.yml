name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches manifest, card and pyproject
        run: python3 scripts/set_version.py --check "${GITHUB_REF_NAME}"

  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  release:
    name: Publish release
    needs: [version, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the HACS zip
        run: |
          cd custom_components/baby_logger
          find . -name "__pycache__" -prune -exec rm -rf {} +
          zip -r "${GITHUB_WORKSPACE}/baby_logger.zip" . -x "*.pyc"
          unzip -l "${GITHUB_WORKSPACE}/baby_logger.zip"
      - name: Verify the zip
        run: |
          for f in manifest.json __init__.py brand/icon.png frontend/baby-logger-card.js translations/en.json; do
            unzip -l baby_logger.zip | grep -q " ${f}$" || { echo "::error::$f missing from zip"; exit 1; }
          done
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" baby_logger.zip \
            --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" ${prerelease}
