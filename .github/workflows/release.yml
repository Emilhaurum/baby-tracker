name: Release

# Two ways to release:
# - Actions -> Release -> "Run workflow" on main with a version (e.g. 1.0.0):
#   validates, then creates the v<version> tag and the GitHub release.
# - Push a v<version> tag: validates and publishes the release for that tag.
#   If a release for the tag already exists (e.g. made on GitHub's release
#   page), the zip is attached to it instead.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (must match manifest.json)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Run the release from the main branch (got ${GITHUB_REF})."
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}"
      - name: Tag matches manifest, card and pyproject
        run: python3 scripts/set_version.py --check "${{ steps.tag.outputs.tag }}"
      - name: The tag is not already used for another commit
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if existing="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)" && [[ -n "${existing}" ]]; then
            echo "::error::Tag ${TAG} already exists. Bump the version with scripts/set_version.py first."
            exit 1
          fi

  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  release:
    name: Publish release
    needs: [version, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the HACS zip
        run: |
          cd custom_components/baby_logger
          find . -name "__pycache__" -prune -exec rm -rf {} +
          zip -r "${GITHUB_WORKSPACE}/baby_logger.zip" . -x "*.pyc"
          unzip -l "${GITHUB_WORKSPACE}/baby_logger.zip"
      - name: Verify the zip
        run: |
          for f in manifest.json __init__.py brand/icon.png frontend/baby-logger-card.js translations/en.json; do
            unzip -l baby_logger.zip | grep -q " ${f}$" || { echo "::error::$f missing from zip"; exit 1; }
          done
      - name: Create the GitHub release
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; attaching the zip."
            gh release upload "${TAG}" baby_logger.zip --clobber
            exit 0
          fi
          prerelease=""
          if [[ "${TAG}" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Creates the tag on the commit that was validated.
            gh release create "${TAG}" baby_logger.zip --target "${GITHUB_SHA}" \
              --generate-notes --title "${TAG}" ${prerelease}
          else
            gh release create "${TAG}" baby_logger.zip \
              --verify-tag --generate-notes --title "${TAG}" ${prerelease}
          fi
